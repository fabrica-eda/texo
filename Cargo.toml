[package]
name = "texo-release-metadata"
description = "Release metadata anchor for the Texo workspace"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = [
    "crates/texo-cli",
    "crates/texo-flow",
    "crates/texo-model",
    "crates/texo-pnr",
    "crates/texo-struo",
    "crates/texo-target-ecp5",
    "crates/texo-timing",
]
default-members = ["crates/texo-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
authors = ["Texo contributors"]
license = "MIT"
repository = "https://github.com/fabrica-eda/texo"

[workspace.dependencies]
celox = { version = "=0.10.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12"
libm = "0.2"
rustdct = "0.7.1"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
zstd = "0.13"
struo-celox = "0.2.0"
struo = "0.2.0"
struo-frontend-veryl = "0.2.0"
struo-ir = "0.2.0"
struo-rtl = "0.2.0"
struo-synth = "0.2.0"
struo-target-ecp5 = "0.2.0"
texo-flow = { version = "=0.2.1", path = "crates/texo-flow" } # x-release-please-version
texo-model = { version = "=0.2.1", path = "crates/texo-model" } # x-release-please-version
texo-pnr = { version = "=0.2.1", path = "crates/texo-pnr" } # x-release-please-version
texo-struo = { version = "=0.2.1", path = "crates/texo-struo" } # x-release-please-version
texo-target-ecp5 = { version = "=0.2.1", path = "crates/texo-target-ecp5" } # x-release-please-version
texo-timing = { version = "=0.2.1", path = "crates/texo-timing" } # x-release-please-version
veryl-analyzer = "=0.22.0"
veryl-metadata = "=0.22.0"
veryl-parser = "=0.22.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
