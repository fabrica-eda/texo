[package]
name = "texo-release-metadata"
description = "Release metadata anchor for the Texo workspace"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = [
    "crates/texo-cli",
    "crates/texo-flow",
    "crates/texo-model",
    "crates/texo-pnr",
    "crates/texo-struo",
    "crates/texo-target-ecp5",
    "crates/texo-timing",
]
default-members = ["crates/texo-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["Texo contributors"]

[workspace.dependencies]
celox = { version = "=0.3.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
postcard = { version = "1.1.3", features = ["use-std"] }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
zstd = "0.13"
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-example-axi4-smartconnect = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-ir = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-rtl = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "8fb85bc5850a06deed66046f6e1ac87852292a47" }
texo-flow = { path = "crates/texo-flow" }
texo-model = { path = "crates/texo-model" }
texo-pnr = { path = "crates/texo-pnr" }
texo-struo = { path = "crates/texo-struo" }
texo-target-ecp5 = { path = "crates/texo-target-ecp5" }
texo-timing = { path = "crates/texo-timing" }
veryl-analyzer = "=0.20.3"
veryl-metadata = "=0.20.3"
veryl-parser = "=0.20.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
