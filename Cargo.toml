[workspace]
members = [
    "crates/texo-cli",
    "crates/texo-flow",
    "crates/texo-model",
    "crates/texo-pnr",
]
default-members = ["crates/texo-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Texo contributors"]

[workspace.dependencies]
celox = { version = "=0.3.1", default-features = false }
texo-flow = { path = "crates/texo-flow" }
texo-model = { path = "crates/texo-model" }
texo-pnr = { path = "crates/texo-pnr" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
