[package]
name = "texo-cli"
description = "Command-line interface for Texo"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
# Development benchmarks and measurements, and integration tests that read the
# repository's example projects; not part of the published crate.
exclude = ["examples/", "tests/binary_checkpoint_cli.rs", "tests/core250_qor.rs"]

[[bin]]
name = "texo"
path = "src/main.rs"

[dependencies]
ciborium = "0.2.2"
tempfile = "3.27.0"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
struo-frontend-veryl.workspace = true
struo-rtl.workspace = true
struo-synth.workspace = true
struo-target-ecp5.workspace = true
texo-flow.workspace = true
texo-model.workspace = true
texo-struo.workspace = true
texo-target-ecp5.workspace = true
ureq.workspace = true
veryl-analyzer.workspace = true
veryl-metadata.workspace = true
veryl-parser.workspace = true
zstd.workspace = true

[dev-dependencies]
texo-timing.workspace = true
celox.workspace = true
struo-celox.workspace = true
struo.workspace = true
struo-ir.workspace = true

[lints]
workspace = true
